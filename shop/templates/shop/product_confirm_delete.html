{% extends 'shop/base.html' %}
{% block title %}Delete {{ product.name }} | DjangoShop{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="border rounded p-4"><h1>Delete product?</h1><p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p><p class="text-muted">This action cannot be undone.</p><form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">Yes, delete product</button><a class="btn btn-outline-secondary ms-2" href="{% url 'product_detail' product.id %}">Cancel</a></form></div></div></div>{% endblock %}
