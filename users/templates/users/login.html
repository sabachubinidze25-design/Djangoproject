{% extends 'shop/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Log in</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <p class="mt-3">
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>
</div>
{% endblock %}
